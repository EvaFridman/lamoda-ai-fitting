# Local development: the whole stack with one command.
#   ./scripts/init-env.sh            # once: creates .env with random passwords
#   docker compose up -d --wait      # everything healthy (or running, for the worker)
# Sources are bind-mounted: api, the worker and web reload on change, no rebuild needed. Ports are
# published on 127.0.0.1 only. Production uses deploy/compose/*.yml instead of this file.

name: ai-fitting

x-api-env: &api-env
  NODE_ENV: development
  PORT: 3000
  LOG_LEVEL: ${LOG_LEVEL:-info}
  WEB_ORIGIN: http://localhost:${WEB_HOST_PORT:-3001}
  APP_VERSION: dev
  # Containers reach each other by service name, never localhost.
  DATABASE_URL: postgresql://${POSTGRES_USER:?run scripts/init-env.sh}:${POSTGRES_PASSWORD:?run scripts/init-env.sh}@postgres:5432/${POSTGRES_DB:?run scripts/init-env.sh}
  REDIS_URL: redis://redis:6379
  TEMPORAL_ADDRESS: temporal:7233
  # Quota tiers (spec 0006 F6); the defaults are the api's own.
  THROTTLE_READ_BURST: ${THROTTLE_READ_BURST:-10}
  THROTTLE_READ_MINUTE: ${THROTTLE_READ_MINUTE:-300}
  THROTTLE_WRITE_BURST: ${THROTTLE_WRITE_BURST:-3}
  THROTTLE_WRITE_MINUTE: ${THROTTLE_WRITE_MINUTE:-60}
  THROTTLE_EXPENSIVE_BURST: ${THROTTLE_EXPENSIVE_BURST:-1}
  THROTTLE_EXPENSIVE_MINUTE: ${THROTTLE_EXPENSIVE_MINUTE:-10}
  # JSON body limit in bytes (spec 0006 F12); the default is the api's own.
  BODY_LIMIT: ${BODY_LIMIT:-102400}
  # Request timeout in ms, then 503 (spec 0006 F11); the default is the api's own.
  REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-10000}
  # Largest socket.io message in bytes (spec 0006 F8); the default is the api's own.
  SOCKET_MAX_MESSAGE_BYTES: ${SOCKET_MAX_MESSAGE_BYTES:-65536}
  ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
  # Required in .env (may be empty): a .env made before spec 0006 lacks it, see README.
  PROXY_SECRET: ${PROXY_SECRET?add PROXY_SECRET to .env (openssl rand -hex 32), see README}
  # Optional: trusted as well while PROXY_SECRET is rotated (spec 0006 F21).
  PROXY_SECRET_NEXT: ${PROXY_SECRET_NEXT:-}
  MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:${WEB_HOST_PORT:-3001}/media/}
  # The emulator below (spec 0011). Signed links carry the browser's address: its published port.
  S3_ENDPOINT: http://s3:8333
  S3_PUBLIC_ENDPOINT: http://localhost:${S3_HOST_PORT:-8333}
  S3_BUCKET: ${S3_BUCKET:-ai-fitting}
  # Required in .env: a .env made before spec 0011 lacks them, see README.
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?add S3_ACCESS_KEY_ID to .env (openssl rand -hex 10), see README}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?add S3_SECRET_ACCESS_KEY to .env (openssl rand -hex 20), see README}
  # Signed link lifetime in seconds (spec 0011 M9); the default is the api's own.
  S3_SIGNED_URL_TTL_SECONDS: ${S3_SIGNED_URL_TTL_SECONDS:-900}
  # Empty turns Sentry off.
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}

# Sources over the image's copy. The anonymous volume keeps the Prisma client generated inside the
# image visible under the mounted src/ (after a schema change: `docker compose up -d --build
# --renew-anon-volumes --wait api temporal-worker`). prisma/ is mounted so new migrations land in
# the repository.
x-api-volumes: &api-volumes
  - ./api/src:/app/src
  - /app/src/generated
  - ./api/prisma:/app/prisma
  # The demo catalog's photos, which `seed:dev` uploads to the emulator (spec 0011 M13).
  - ./api/seed-media:/app/seed-media:ro

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # PostgreSQL 18 keeps its data in a versioned folder under /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    ports:
      # 5433, not 5432: a Postgres installed on the Mac may already hold the default port.
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.10.2-trixie
    volumes:
      - redisdata:/data
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6380}:6379'
    healthcheck:
      # redis-cli exits 0 even on an error reply (e.g. LOADING), so check for PONG.
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  temporal:
    image: temporalio/temporal:1.9.1
    # Single-node dev server, workflow history in a SQLite file on a volume. The web UI is on
    # http://localhost:8233; the gRPC port 7233 stays inside the compose network.
    command:
      - server
      - start-dev
      - --ip=0.0.0.0
      - --ui-ip=0.0.0.0
      - --db-filename=/home/temporal/temporal.db
    volumes:
      # The image's home directory belongs to the temporal user, so a fresh volume does too.
      - temporaldata:/home/temporal
    ports:
      - '127.0.0.1:${TEMPORAL_UI_HOST_PORT:-8233}:8233'
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', '127.0.0.1:7233']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  s3:
    image: chrislusf/seaweedfs:4.48
    # SeaweedFS as an S3 emulator (spec 0011 M12): one process, the bucket created from S3_BUCKET at
    # start, an admin user from the AWS_* keys. Only the S3 port is published; telemetry, the admin
    # UI and WebDAV are off, and a write to a missing bucket fails instead of creating it.
    command:
      - mini
      - -dir=/data
      - -master.telemetry=false
      - -admin.ui=false
      - -webdav=false
      - -s3.autoCreateBucket=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?add S3_ACCESS_KEY_ID to .env (openssl rand -hex 10), see README}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?add S3_SECRET_ACCESS_KEY to .env (openssl rand -hex 20), see README}
      S3_BUCKET: ${S3_BUCKET:-ai-fitting}
    volumes:
      - s3data:/data
    ports:
      - '127.0.0.1:${S3_HOST_PORT:-8333}:8333'
    healthcheck:
      # Ready, and the bucket exists: it is created a moment after the S3 port answers. The filer's
      # port (8888) is the container's own, unpublished.
      test:
        - CMD-SHELL
        - curl -fsS -o /dev/null http://localhost:8333/healthz && curl -fsS -o /dev/null "http://localhost:8888/buckets/$${S3_BUCKET}/"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-shot: the bucket's rules (src/storage/dev-setup.ts), the local counterpart of the owner's
  # setup (media/ is readable by anyone here, only by the server in production). api, the worker and
  # web start only after it exits 0; running it again changes nothing. It compiles src/ with the
  # Prisma client of its own anonymous volume, so a schema change renews it too.
  s3-init:
    image: ${COMPOSE_PROJECT_NAME:-ai-fitting}-api:dev
    build:
      context: ./api
      target: dev
    command: ['npm', 'run', 'storage:setup:dev']
    environment: *api-env
    volumes: *api-volumes
    depends_on:
      s3:
        condition: service_healthy

  api:
    build:
      context: ./api
      target: dev
    # Per-project tag: a second copy (another worktree, README) must not overwrite this image.
    # The default repeats `name:` above; change both together.
    image: ${COMPOSE_PROJECT_NAME:-ai-fitting}-api:dev
    environment: *api-env
    volumes: *api-volumes
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3000}:3000'
    healthcheck:
      # Liveness only: an unavailable dependency is not a dead process (/health/ready reports it).
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      # Watch mode compiles before it starts listening.
      start_period: 60s
    depends_on: &infra-healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully

  temporal-worker:
    # Same image as api, different entry point. No HTTP port, so no healthcheck.
    build:
      context: ./api
      target: dev
    image: ${COMPOSE_PROJECT_NAME:-ai-fitting}-api:dev
    command: ['npm', 'run', 'start:worker:dev']
    environment: *api-env
    volumes: *api-volumes
    depends_on: *infra-healthy

  web:
    build:
      context: ./web
      # `next dev` on the project's sources and configs; no production build.
      target: dev
    image: ${COMPOSE_PROJECT_NAME:-ai-fitting}-web:dev
    environment:
      API_URL: http://api:3000
      REDIS_URL: redis://redis:6379
      APP_VERSION: dev
      # Locally there is no nginx: web is the only one that sends the secret to the api.
      PROXY_SECRET: ${PROXY_SECRET?add PROXY_SECRET to .env (openssl rand -hex 32), see README}
      # Empty turns analytics off; a dummy token in .env is for local checks only.
      NEXT_PUBLIC_MIXPANEL_TOKEN: ${NEXT_PUBLIC_MIXPANEL_TOKEN:-}
      # `next dev` forwards /media/ to the emulator's media/ (spec 0011 plan §6); no keys: the
      # emulator lets anyone read media/ (M15).
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: ${S3_BUCKET:-ai-fitting}
    volumes:
      - ./web/app:/app/app
      - ./web/src:/app/src
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-3001}:3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      # next dev compiles a page on its first request.
      timeout: 30s
      retries: 3
      start_period: 120s
    depends_on:
      api:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
  temporaldata:
  s3data:
