# The proxy to OpenAI (spec 0019 A73) on its own VPS abroad: OpenAI blocks the production server's
# region, so the api and the worker send every request to OpenAI through it. Squid lets through only
# `CONNECT api.openai.com:443` of a client with the login and password; the firewall lets only the
# production server reach SSH and the proxy's port. Safe to re-run. Run from the owner's machine
# (deploy/README.md, «Прокси к OpenAI»):
#   cd deploy/ansible
#   read -rs OPENAI_PROXY_PASSWORD; export OPENAI_PROXY_PASSWORD
#   OPENAI_PROXY_USER=aifitting PRODUCTION_IP=<the server's address> ansible-playbook openai-proxy.yml
- name: Prepare the proxy to OpenAI
  hosts: openai_proxy
  vars:
    proxy_port: 3128
    # From the environment, so the password is in no file and no command line.
    proxy_user: "{{ lookup('env', 'OPENAI_PROXY_USER') }}"
    proxy_password: "{{ lookup('env', 'OPENAI_PROXY_PASSWORD') }}"
    production_ip: "{{ lookup('env', 'PRODUCTION_IP') }}"

  tasks:
    # Letters and digits only: the URL that holds them goes into the server's .env unquoted and
    # unencoded (cd.yml's format check). 24 characters at least: it crosses between the two servers
    # in clear (A73), the firewall being the line and the password the second one.
    - name: The login, the password and the production server's address are given
      ansible.builtin.assert:
        that:
          - proxy_user is match('^[A-Za-z0-9]+$')
          - proxy_password is match('^[A-Za-z0-9]{24,}$')
          - production_ip is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
        fail_msg: >-
          Set OPENAI_PROXY_USER (letters and digits), OPENAI_PROXY_PASSWORD (24+ letters and digits)
          and PRODUCTION_IP (the production server's IPv4 address)
        quiet: true
      no_log: true

    # The owner reaches this host through the production server (`ProxyJump ai-fitting`), so this
    # session comes from its address: a mistyped PRODUCTION_IP would let a stranger in and lock the
    # owner out once the default deny is on (the provider's web console being the only way in).
    # Before anything is installed, so a wrong run leaves no Squid listening without a firewall.
    - name: This session comes from the production server
      ansible.builtin.assert:
        that:
          - ansible_facts['env']['SSH_CLIENT'].split()[0] == production_ip
        fail_msg: >-
          PRODUCTION_IP is not the address this session comes from: run through the production
          server (ProxyJump ai-fitting) and check the address
        quiet: true

    - name: Squid, ufw and passlib (for the password file) from Ubuntu's packages
      ansible.builtin.apt:
        name: [squid, ufw, python3-passlib]
        state: present
        update_cache: true
        cache_valid_time: 86400

    - name: The proxy's one login
      community.general.htpasswd:
        path: /etc/squid/passwd
        name: '{{ proxy_user }}'
        password: '{{ proxy_password }}'
        # What Squid's basic_ncsa_auth reads.
        crypt_scheme: apr_md5_crypt
        owner: root
        group: proxy
        mode: '0640'
      no_log: true
      notify: Restart Squid

    - name: Squid's config
      ansible.builtin.copy:
        dest: /etc/squid/squid.conf
        owner: root
        group: root
        mode: '0644'
        validate: squid -k parse -f %s
        content: |
          # Managed by deploy/ansible/openai-proxy.yml (spec 0019 A73); changes here are overwritten.
          http_port {{ proxy_port }}

          auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
          auth_param basic children 2
          auth_param basic realm openai-proxy
          acl authenticated proxy_auth REQUIRED

          # Only a tunnel to OpenAI's API; -n: an address in place of the name is not looked up.
          acl tunnel method CONNECT
          acl openai_port port 443
          acl openai_host dstdomain -n api.openai.com
          http_access deny !tunnel
          http_access deny !openai_port
          http_access deny !openai_host
          http_access allow authenticated
          http_access deny all

          # Nothing of the client goes on, nothing is kept.
          via off
          forwarded_for delete
          httpd_suppress_version_string on
          cache deny all
          cache_mem 8 MB

          # The connection only (time, client, CONNECT api.openai.com:443, status, bytes): TLS keeps
          # the content out. Rotated by the package's logrotate.
          logformat connection %ts.%03tu %>a %rm %ru %>Hs %<st
          access_log daemon:/var/log/squid/access.log connection
          cache_log /var/log/squid/cache.log
      notify: Restart Squid

    - name: Squid runs and starts on boot
      ansible.builtin.service:
        name: squid
        state: started
        enabled: true

    # Before the default deny, or the run would cut its own SSH. Only adds: after the production
    # server moves, its old address is removed by hand (deploy/README.md, «Прокси к OpenAI»).
    - name: Firewall allows SSH and the proxy's port from the production server only
      community.general.ufw:
        rule: allow
        from_ip: '{{ production_ip }}'
        port: '{{ item }}'
        proto: tcp
      loop: ['22', '{{ proxy_port }}']

    - name: Firewall denies everything else coming in
      community.general.ufw:
        state: enabled
        default: deny
        direction: incoming

    # The tasks above only add rules: one the image or a hand left (`allow OpenSSH` from anywhere)
    # would keep SSH or the proxy open to everyone. Removed by hand: `ufw status numbered`,
    # `ufw delete <number>`.
    - name: The firewall's rules
      ansible.builtin.command: ufw status
      register: ufw_status
      changed_when: false
      check_mode: false

    # Each line without its comment; the rules that let in (ALLOW, LIMIT, IN or FWD, not OUT) whose
    # whole «From» is not the production server's address. A comment or a longer address that
    # contains it never passes (spec 0019 A79.2).
    - name: No rule lets in anyone but the production server
      ansible.builtin.assert:
        that:
          - ufw_status.stdout_lines | map('regex_replace', '\s+#.*$', '') | select('search', '\s(ALLOW|LIMIT)(\s+(IN|FWD))?(\s|$)') | reject('search', '\s(ALLOW|LIMIT) OUT(\s|$)') | reject('search', '\s' ~ (production_ip | regex_escape) ~ '(/32)?\s*$') | list | length == 0
        fail_msg: >-
          ufw allows an address other than PRODUCTION_IP; remove that rule by hand (ufw status
          numbered, ufw delete <number>)
        quiet: true

  handlers:
    - name: Restart Squid
      ansible.builtin.service:
        name: squid
        state: restarted
