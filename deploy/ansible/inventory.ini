# The production server. `ai-fitting` is the host alias in the owner's ~/.ssh/config (address, root
# user and key live there, not in the repository).
[prod]
ai-fitting

# The proxy to OpenAI on a VPS abroad (spec 0019 A73, openai-proxy.yml). `openai-proxy` is the
# owner's alias too, reached through the production server (`ProxyJump ai-fitting`).
[openai_proxy]
openai-proxy
