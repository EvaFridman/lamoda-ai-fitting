# Production, one copy of the app: api and web of one colour (blue or green) and one image tag.
# Started as compose project ai-fitting-<colour> by deploy/scripts/deploy.sh with COLOR and IMAGE_TAG
# set; joins the network of infra.yml under the names api-<colour> and web-<colour>, which nginx's
# upstream file points at. No ports are published: traffic comes only through nginx.

x-restart: &restart
  restart: unless-stopped

networks:
  ai-fitting:
    external: true

services:
  api:
    <<: *restart
    image: ${IMAGE_REGISTRY:-}ai-fitting-api:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEB_ORIGIN: https://${SITE_DOMAIN:?set SITE_DOMAIN}
      APP_VERSION: ${IMAGE_TAG}
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      # Quota tiers (spec 0006 F6); the defaults are the api's own.
      THROTTLE_READ_BURST: ${THROTTLE_READ_BURST:-10}
      THROTTLE_READ_MINUTE: ${THROTTLE_READ_MINUTE:-300}
      THROTTLE_WRITE_BURST: ${THROTTLE_WRITE_BURST:-3}
      THROTTLE_WRITE_MINUTE: ${THROTTLE_WRITE_MINUTE:-60}
      THROTTLE_EXPENSIVE_BURST: ${THROTTLE_EXPENSIVE_BURST:-1}
      THROTTLE_EXPENSIVE_MINUTE: ${THROTTLE_EXPENSIVE_MINUTE:-10}
      # JSON body limit in bytes (spec 0006 F12); the default is the api's own.
      BODY_LIMIT: ${BODY_LIMIT:-102400}
      # Empty closes the admin routes (spec 0004 E1).
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      # Only requests with it (nginx, web) name the client address and request id (spec 0006 F13);
      # the api refuses to start without it in production (F18).
      PROXY_SECRET: ${PROXY_SECRET:?set PROXY_SECRET}
      # Trusted as well while the secret is rotated, empty otherwise (F21); nginx and web never send
      # it, so only the api gets it.
      PROXY_SECRET_NEXT: ${PROXY_SECRET_NEXT:-}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:?set MEDIA_BASE_URL}
      # The api's own Sentry project (SENTRY_DSN in .env is web's); empty turns it off.
      SENTRY_DSN: ${API_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    networks:
      ai-fitting:
        aliases: ['api-${COLOR:?set COLOR}']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 20s
      # Every second until the first success, so the deploy switches to a ready copy at once.
      start_interval: 1s

  web:
    <<: *restart
    image: ${IMAGE_REGISTRY:-}ai-fitting-web:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      # This colour's own api, over the internal network.
      API_URL: http://api-${COLOR:?set COLOR}:3000
      REDIS_URL: redis://redis:6379
      APP_VERSION: ${IMAGE_TAG}
      # Sent with the visitor's address to the api (spec 0006 F13). Without it web would not start
      # and the running copy keeps serving (F20).
      PROXY_SECRET: ${PROXY_SECRET:?set PROXY_SECRET}
      # Server-side Sentry; empty turns it off. The browser's DSN is baked in at build time.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    networks:
      ai-fitting:
        aliases: ['web-${COLOR}']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 20s
      start_interval: 1s
    depends_on:
      api:
        condition: service_healthy
