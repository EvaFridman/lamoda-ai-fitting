# Production, one copy of the app: api and web of one colour (blue or green) and one image tag.
# Started as compose project ai-fitting-<colour> by deploy/scripts/deploy.sh with COLOR and IMAGE_TAG
# set; joins the network of infra.yml under the names api-<colour> and web-<colour>, which nginx's
# upstream file points at. No ports are published: traffic comes only through nginx.

x-restart: &restart
  restart: unless-stopped

networks:
  ai-fitting:
    external: true

services:
  api:
    <<: *restart
    image: ${IMAGE_REGISTRY:-}ai-fitting-api:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEB_ORIGIN: https://${SITE_DOMAIN:?set SITE_DOMAIN}
      APP_VERSION: ${IMAGE_TAG}
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      REDIS_CACHE_URL: redis://redis-cache:6379
      TEMPORAL_ADDRESS: temporal:7233
      # Quota tiers (spec 0006 F6); the defaults are the api's own.
      THROTTLE_READ_BURST: ${THROTTLE_READ_BURST:-10}
      THROTTLE_READ_MINUTE: ${THROTTLE_READ_MINUTE:-300}
      THROTTLE_WRITE_BURST: ${THROTTLE_WRITE_BURST:-3}
      THROTTLE_WRITE_MINUTE: ${THROTTLE_WRITE_MINUTE:-60}
      THROTTLE_EXPENSIVE_BURST: ${THROTTLE_EXPENSIVE_BURST:-1}
      THROTTLE_EXPENSIVE_MINUTE: ${THROTTLE_EXPENSIVE_MINUTE:-10}
      # JSON body limit in bytes (spec 0006 F12); the default is the api's own.
      BODY_LIMIT: ${BODY_LIMIT:-102400}
      # Request timeout in ms, then 503 (spec 0006 F11); the default is the api's own.
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-10000}
      # The database pool and its timeouts (spec 0014 plan §2.7); the defaults are the api's own.
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-5000}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-2000}
      # Largest socket.io message in bytes (spec 0006 F8); the default is the api's own.
      SOCKET_MAX_MESSAGE_BYTES: ${SOCKET_MAX_MESSAGE_BYTES:-65536}
      # Seconds the filter counts stay in Redis (spec 0014 plan §2.6); the default is the api's own.
      FACETS_CACHE_TTL_SECONDS: ${FACETS_CACHE_TTL_SECONDS:-60}
      # Only requests with it (nginx, web) name the client address and request id (spec 0006 F13);
      # the api refuses to start without it in production (F18).
      PROXY_SECRET: ${PROXY_SECRET:?set PROXY_SECRET}
      # Trusted as well while the secret is rotated, empty otherwise (F21); nginx and web never send
      # it, so only the api gets it.
      PROXY_SECRET_NEXT: ${PROXY_SECRET_NEXT:-}
      # Sign-in with Google (spec 0013 plan §8); the api refuses to start without them in production
      # and never gets the fake provider's addresses here.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:?set MEDIA_BASE_URL}
      # The app's bucket and the key of its "Чтение и запись" user (spec 0011 M10, M14); the api
      # refuses to start without them (M19). Signed links carry S3_ENDPOINT's host: no
      # S3_PUBLIC_ENDPOINT here. The defaults are the api's own.
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-ru-1}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_SIGNED_URL_TTL_SECONDS: ${S3_SIGNED_URL_TTL_SECONDS:-900}
      # AI fitting (spec 0019 plan §10): the OpenAI key of the photo and text checks and the proxy
      # they go through (A73); the api refuses to start without either in production (AC27). The
      # defaults are the api's own.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_PROXY_URL: ${OPENAI_PROXY_URL:-}
      FITTING_MODEL: ${FITTING_MODEL:-gpt-image-2}
      FITTING_VISION_MODEL: ${FITTING_VISION_MODEL:-gpt-6-luna}
      FITTING_MONTHLY_LIMIT: ${FITTING_MONTHLY_LIMIT:-10}
      FITTING_TIMEOUT_SECONDS: ${FITTING_TIMEOUT_SECONDS:-180}
      FITTING_CHECK_TIMEOUT_MS: ${FITTING_CHECK_TIMEOUT_MS:-4000}
      FITTING_PHOTO_MAX_BYTES: ${FITTING_PHOTO_MAX_BYTES:-20971520}
      # The api's own Sentry project (SENTRY_DSN in .env is web's); empty turns it off.
      SENTRY_DSN: ${API_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    networks:
      ai-fitting:
        aliases: ['api-${COLOR:?set COLOR}']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/live').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 20s
      # Every second until the first success, so the deploy switches to a ready copy at once.
      start_interval: 1s

  web:
    <<: *restart
    image: ${IMAGE_REGISTRY:-}ai-fitting-web:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      # This colour's own api, over the internal network.
      API_URL: http://api-${COLOR:?set COLOR}:3000
      REDIS_CACHE_URL: redis://redis-cache:6379
      # Seconds a cached catalog read stays fresh (spec 0018 V3); the default is web's own.
      PAGE_CACHE_REVALIDATE_SECONDS: ${PAGE_CACHE_REVALIDATE_SECONDS:-60}
      APP_VERSION: ${IMAGE_TAG}
      # The base of absolute links in metadata (spec 0014 O68), the same address as the api's
      # WEB_ORIGIN.
      SITE_URL: https://${SITE_DOMAIN:?set SITE_DOMAIN}
      # Sent with the visitor's address to the api (spec 0006 F13). Without it web would not start
      # and the running copy keeps serving (F20).
      PROXY_SECRET: ${PROXY_SECRET:?set PROXY_SECRET}
      # The origin and bucket of the users' photos' signed links, which carry S3_ENDPOINT's host in
      # production (the api's): the CSP lets images load from the bucket's keep/users/ (spec 0019).
      S3_PUBLIC_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      # Server-side Sentry; empty turns it off. The browser's DSN is baked in at build time.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    networks:
      ai-fitting:
        aliases: ['web-${COLOR}']
    healthcheck:
      # web's own route, 200 without the api (spec 0014 O34). An image from before spec 0014 PR 3
      # has none and never becomes healthy (O70).
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 20s
      start_interval: 1s
    depends_on:
      api:
        condition: service_healthy
