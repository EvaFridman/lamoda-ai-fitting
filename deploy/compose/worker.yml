# Production Temporal worker: one copy, replaced in place on every deploy (compose project
# ai-fitting-worker). Not blue-green: two worker versions polling one task queue could replay running
# workflows with different code and fail them; Temporal queues tasks while the worker restarts.

name: ai-fitting-worker

networks:
  ai-fitting:
    external: true

services:
  temporal-worker:
    restart: unless-stopped
    image: ${IMAGE_REGISTRY:-}ai-fitting-api:${IMAGE_TAG:?set IMAGE_TAG}
    command: ['node', 'dist/temporal/worker.js']
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEB_ORIGIN: https://${SITE_DOMAIN:?set SITE_DOMAIN}
      APP_VERSION: ${IMAGE_TAG}
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      # Read by no activity, but the api's environment requires it (config/env.ts).
      REDIS_CACHE_URL: redis://redis-cache:6379
      TEMPORAL_ADDRESS: temporal:7233
      # The worker validates the api's environment too (config/env.ts).
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:?set MEDIA_BASE_URL}
      # It deletes users' files (spec 0011 M19): the api's storage settings (app.yml).
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-ru-1}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      # It runs the generations (spec 0019 plan §10): the OpenAI key and the fitting settings of the
      # api (app.yml); the worker refuses to start without the key in production (AC27).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FITTING_MODEL: ${FITTING_MODEL:-gpt-image-2}
      FITTING_VISION_MODEL: ${FITTING_VISION_MODEL:-gpt-6-luna}
      FITTING_MONTHLY_LIMIT: ${FITTING_MONTHLY_LIMIT:-10}
      FITTING_TIMEOUT_SECONDS: ${FITTING_TIMEOUT_SECONDS:-180}
      FITTING_CHECK_TIMEOUT_MS: ${FITTING_CHECK_TIMEOUT_MS:-4000}
      FITTING_PHOTO_MAX_BYTES: ${FITTING_PHOTO_MAX_BYTES:-20971520}
      # The api's own Sentry project (SENTRY_DSN in .env is web's); empty turns it off.
      SENTRY_DSN: ${API_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    networks:
      - ai-fitting
