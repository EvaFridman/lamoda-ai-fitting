name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege by default; a job that needs more asks for it.
permissions:
  contents: read

# A new push to the same pull request cancels the run that is now outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NPM_VERSION: 12.2.0

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan the whole git history with gitleaks
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, for commit message checks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            web/package-lock.json

      # Node ships npm 11; the project needs 12 (install scripts only from allowScripts).
      - name: Install npm ${{ env.NPM_VERSION }}
        run: npm install -g "npm@$NPM_VERSION"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix api
          npm ci --prefix web

      # Hooks run only on developers' machines; this catches commits made without them.
      - name: Commit messages
        if: github.event_name == 'pull_request'
        # Event values go through env, never straight into the script (workflow injection).
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      # Format, lint, typecheck, tests, build: the same command as the pre-push hook and the local
      # check before a task is done. Add checks to `verify` in package.json, not here.
      - name: Verify
        run: npm run verify

  images:
    name: Images
    needs: [secrets, checks]
    runs-on: ubuntu-latest
    # The Sentry token is a secret of the production environment (it accepts protected branches
    # only); pull requests run without an environment and so without the token.
    environment: ${{ github.event_name == 'push' && 'production' || '' }}
    # Pushing to GHCR needs packages: write; it happens only on a push to main (last step).
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image tag and registry
        id: tag
        # The short commit hash is the image tag and the version the site reports; GHCR needs a
        # lower-case owner.
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/" >> "$GITHUB_ENV"
          echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build api and web images
        env:
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          # Browser-side Sentry is baked in at build time; empty values turn it off.
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_PROJECT_API: ${{ vars.SENTRY_PROJECT_API }}
          # Source maps are uploaded only for images that can be deployed (main).
          SENTRY_AUTH_TOKEN: ${{ github.event_name == 'push' && secrets.SENTRY_AUTH_TOKEN || '' }}
        run: scripts/ci-build-images.sh

      # The production setup on the runner with the same deploy.sh the server runs: a first deploy,
      # then a blue-green switch under a request loop that must see no failed request (AC26).
      - name: Deploy check
        run: scripts/ci-deploy-check.sh

      - name: Publish images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGE_REGISTRY}ai-fitting-api:${IMAGE_TAG}"
          docker push "${IMAGE_REGISTRY}ai-fitting-web:${IMAGE_TAG}"
          docker logout ghcr.io

  # Continuous delivery: every push to main whose images passed the checks above goes live.
  cd:
    name: CD
    needs: [images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/cd.yml
    with:
      image_tag: ${{ needs.images.outputs.image_tag }}
    secrets: inherit
