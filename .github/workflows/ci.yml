name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege by default; a job that needs more asks for it.
permissions:
  contents: read

# A new push to the same pull request cancels the run that is now outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NPM_VERSION: 12.2.0

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the whole git history with gitleaks
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, for commit message checks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Nothing after a checkout uses git with the token; it does not stay in .git/config.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            web/package-lock.json

      # Node ships npm 11; the project needs 12 (install scripts only from allowScripts).
      - name: Install npm ${{ env.NPM_VERSION }}
        run: npm install -g "npm@$NPM_VERSION"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix api
          npm ci --prefix web

      # Hooks run only on developers' machines; this catches commits made without them.
      - name: Commit messages
        if: github.event_name == 'pull_request'
        # Event values go through env, never straight into the script (workflow injection).
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      # Format, lint, typecheck, tests, build: the same command as the pre-push hook and the local
      # check before a task is done. Add checks to `verify` in package.json, not here.
      - name: Verify
        run: npm run verify

  # Images run alongside Checks (images.yml). A job's permissions cannot depend on the event, so
  # two callers keep packages: write away from pull requests; each run skips one of them.
  images-pr:
    name: Images (PR)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/images.yml
    with:
      publish: false

  # Waits for the secret scan (seconds): a secret must not reach GHCR or Sentry's source maps. Then
  # publishes right after its own build and deploy check, before Checks may have ended: a push whose
  # Checks fail leaves a published image that CD never deploys (CD by hand refuses it, G6).
  images-main:
    name: Images (main)
    needs: [secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      publish: true
    secrets: inherit

  # Continuous delivery: every push to main whose checks and images all passed goes live.
  cd:
    name: CD
    needs: [secrets, checks, images-main]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # As cd.yml's job asks; checks: read is for its by-hand step, skipped here.
    permissions:
      contents: read
      packages: read
      checks: read
    uses: ./.github/workflows/cd.yml
    with:
      image_tag: ${{ needs.images-main.outputs.image_tag }}
    secrets: inherit
