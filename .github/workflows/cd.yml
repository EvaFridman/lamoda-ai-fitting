name: CD

# Deploys one image tag to the production server with deploy/scripts/deploy.sh (blue-green).
# - Called by CI after Secret scan, Checks and Images of a push to main all passed.
# - Run by hand (Actions → CD → Run workflow) with the tag of a version that was live to roll back
#   (AC19); a tag CI never deployed (its Checks or its CD failed) is refused.
on:
  workflow_call:
    inputs:
      image_tag:
        description: Image tag (7-character commit hash)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag (7-character commit hash) to deploy
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # Secrets and variables of the environment; it accepts deployments from protected branches only.
    environment:
      name: production
      url: https://${{ vars.SITE_DOMAIN }}
    # One deploy at a time; a deploy in progress is never cancelled.
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      # A short-lived token for the server to pull the private images from GHCR.
      packages: read
      # To find out by hand whether a tag was live (next steps).
      checks: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - name: Check the image tag
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{7}$ ]] || { echo "not a 7-character commit hash: '$IMAGE_TAG'" >&2; exit 1; }

      # By hand only: CI calls CD after every check of the push passed. Images of main are published
      # before the checks end, so GHCR holds tags that never went live; a tag is deployed by hand only
      # when CI's own CD once deployed its commit (check run "CD / Deploy to production" succeeded).
      - name: Check that the tag was live
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$IMAGE_TAG" --jq .sha)
          # The ref could resolve to a branch or tag of that name; a fork can make a commit with the
          # same prefix and a check run of that name on it. Only a commit of main with this prefix.
          [[ "${sha:0:7}" == "$IMAGE_TAG" ]] || { echo "$IMAGE_TAG resolves to $sha, not a commit with that hash" >&2; exit 1; }
          in_main=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .status)
          [[ "$in_main" == ahead || "$in_main" == identical ]] || { echo "$IMAGE_TAG is not a commit of main" >&2; exit 1; }
          live=$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" \
            -f check_name='CD / Deploy to production' -f filter=all \
            --jq '[.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success")] | length')
          [[ "$live" -gt 0 ]] || { echo "$IMAGE_TAG was never deployed by CI: roll back only to a version that was live" >&2; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: SSH to the server as the deploy user
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's key comes from a secret (checked by the owner), never from the network.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF
          ssh server 'echo "connected to $(hostname) as $(whoami)"'

      - name: Copy the deployment files
        # Synced in place: running containers bind-mount folders of deploy/ (nginx templates), and a
        # folder replaced as a whole stays mounted as the deleted old one. --delete removes files
        # that left the repository.
        run: rsync -a --delete deploy/ server:/opt/ai-fitting/deploy/

      - name: Write the server's .env
        # Rewritten on every deploy from GitHub: editing it on the server by hand is undone next time.
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          API_SENTRY_DSN: ${{ secrets.API_SENTRY_DSN }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}/
        run: |
          {
            echo "POSTGRES_USER=$POSTGRES_USER"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "POSTGRES_DB=$POSTGRES_DB"
            echo "SITE_DOMAIN=$SITE_DOMAIN"
            echo "SENTRY_DSN=$SENTRY_DSN"
            echo "API_SENTRY_DSN=$API_SENTRY_DSN"
            echo "ADMIN_API_TOKEN=$ADMIN_API_TOKEN"
            echo "MEDIA_BASE_URL=$MEDIA_BASE_URL"
            echo "SENTRY_ENVIRONMENT=production"
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "LOG_LEVEL=info"
          } | ssh server 'umask 077 && cat > /opt/ai-fitting/.env'

      - name: Log the server in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # $GITHUB_ACTOR expands here, on the runner, on purpose (SC2029).
        run: |
          # shellcheck disable=SC2029
          echo "$REGISTRY_TOKEN" | ssh server "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"

      - name: Deploy ${{ inputs.image_tag }}
        # $IMAGE_TAG expands on the runner on purpose (SC2029); the first step allows only a hash.
        run: |
          # shellcheck disable=SC2029
          ssh server "DEPLOY_PROFILE=server /opt/ai-fitting/deploy/scripts/deploy.sh '$IMAGE_TAG'"

      - name: Check from outside
        # From the internet, through DNS and the firewall, the site must report the new version.
        # -k (inside smoke-test.sh) until the real certificate is issued; TLS is checked separately.
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: scripts/smoke-test.sh "https://$SITE_DOMAIN" "$IMAGE_TAG"

      - name: Log the server out of GHCR
        if: always()
        run: ssh server 'docker logout ghcr.io' || true
