name: CD

# Deploys one image tag to the production server with deploy/scripts/deploy.sh (blue-green).
# - Called by CI after Secret scan, Checks and Images of a push to main all passed.
# - Run by hand (Actions → CD → Run workflow) with the tag of a version that was live to roll back
#   (AC19); a tag CI never deployed (its Checks or its CD failed) is refused.
on:
  workflow_call:
    inputs:
      image_tag:
        description: Image tag (7-character commit hash)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag (7-character commit hash) to deploy
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # Far above the slowest deploy seen (12.5 min) plus the warm-up (at most 2) and the worker's
    # stop, which waits for running generations (at most 12, spec 0019 A69): a stuck pull or
    # `up --wait` stops here instead of holding the queue for GitHub's 6 hours. A deploy stopped
    # before the switch leaves the running copy serving (spec 0018 V11).
    timeout-minutes: 45
    # Secrets and variables of the environment; it accepts deployments from protected branches only.
    environment:
      name: production
      url: https://${{ vars.SITE_DOMAIN }}
    # One deploy at a time; a newer run never cancels one in progress (only the time limit or a manual cancel does).
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      # A short-lived token for the server to pull the private images from GHCR.
      packages: read
      # To find out by hand whether a tag was live (next steps).
      checks: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - name: Check the image tag, the secrets and the storage and backup settings
        env:
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
          PROXY_SECRET_NEXT: ${{ secrets.PROXY_SECRET_NEXT }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BACKUP_READ_ACCESS_KEY_ID: ${{ secrets.BACKUP_READ_ACCESS_KEY_ID }}
          BACKUP_READ_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_READ_SECRET_ACCESS_KEY }}
          BACKUP_WRITE_ACCESS_KEY_ID: ${{ secrets.BACKUP_WRITE_ACCESS_KEY_ID }}
          BACKUP_WRITE_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_WRITE_SECRET_ACCESS_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # Before anything reaches the server: the synced nginx template needs the secret too, and an
        # nginx restarted without it would not start (spec 0006 F18).
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{7}$ ]] || { echo "not a 7-character commit hash: '$IMAGE_TAG'" >&2; exit 1; }
          # Letters and digits only, as the api and web require: it goes into nginx's config and
          # the sourced .env. The message never shows the value.
          if ! [[ "$PROXY_SECRET" =~ ^[A-Za-z0-9]{32,}$ ]]; then
            echo "::error::secret PROXY_SECRET in GitHub Environment production is missing or not 32+ letters or digits (deploy/README.md)"
            exit 1
          fi
          # Set only while the secret is rotated (F21); checked here so a bad one fails before
          # anything reaches the server, not at the new copy's start.
          if [ -n "$PROXY_SECRET_NEXT" ] && ! [[ "$PROXY_SECRET_NEXT" =~ ^[A-Za-z0-9]{32,}$ ]]; then
            echo "::error::secret PROXY_SECRET_NEXT in GitHub Environment production is not 32+ letters or digits (deploy/README.md)"
            exit 1
          fi
          # Sign-in (spec 0013 N47): the api refuses to start without them in production, so a
          # missing or bad one would fail only the new copy. The secret is letters and digits, as
          # the proxy secret (N21), and differs from both proxy secrets.
          if ! [[ "$BETTER_AUTH_SECRET" =~ ^[A-Za-z0-9]{32,}$ ]]; then
            echo "::error::secret BETTER_AUTH_SECRET in GitHub Environment production is missing or not 32+ letters or digits (deploy/README.md)"
            exit 1
          fi
          if [ "$BETTER_AUTH_SECRET" = "$PROXY_SECRET" ] || [ "$BETTER_AUTH_SECRET" = "$PROXY_SECRET_NEXT" ]; then
            echo "::error::secret BETTER_AUTH_SECRET must differ from PROXY_SECRET and PROXY_SECRET_NEXT (spec 0013 N47)"
            exit 1
          fi
          # The api and the worker refuse to start without them (spec 0011 M19); checked here so a
          # bad one fails before anything reaches the server. An https address of a host (users'
          # photos travel to it) and the api's rule for a bucket name; both go into the sourced .env.
          endpoint_format='^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$'
          if ! [[ "$S3_ENDPOINT" =~ $endpoint_format ]]; then
            echo "::error::variable S3_ENDPOINT in GitHub Environment production is missing or not an https address of a host (deploy/README.md)"
            exit 1
          fi
          bucket_format='^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
          if ! [[ "$S3_BUCKET" =~ $bucket_format ]]; then
            echo "::error::variable S3_BUCKET in GitHub Environment production is missing or not an S3 bucket name (deploy/README.md)"
            exit 1
          fi
          # The backup job (spec 0012 plan §6): deploy.sh stops before the migrations without its
          # variables, and the job refuses to start with a bad one. Its bucket follows the same
          # rule and is not the app's; the recipient is the owner's age public key (P5).
          if ! [[ "$BACKUP_BUCKET" =~ $bucket_format ]] || [ "$BACKUP_BUCKET" = "$S3_BUCKET" ]; then
            echo "::error::variable BACKUP_BUCKET in GitHub Environment production is missing, not an S3 bucket name or the same as S3_BUCKET (deploy/README.md)"
            exit 1
          fi
          if ! [[ "$BACKUP_AGE_RECIPIENT" =~ ^age1[0-9a-z]{58}$ ]]; then
            echo "::error::variable BACKUP_AGE_RECIPIENT in GitHub Environment production is missing or not an age public key, age1… (deploy/README.md)"
            exit 1
          fi
          # The keys, Google's client and the OpenAI key (spec 0019 plan §10) have no format of
          # ours (M19), but they go into the .env that deploy.sh sources and compose reads: only
          # characters both take as they are (bash expands a ~ after = or :). The message never
          # shows them. The api and the worker refuse to start without the OpenAI key (0019 AC27).
          unsafe="[[:space:]\$\`\"'\\\\;&|<>()#~]"
          for name in S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
            BACKUP_READ_ACCESS_KEY_ID BACKUP_READ_SECRET_ACCESS_KEY \
            BACKUP_WRITE_ACCESS_KEY_ID BACKUP_WRITE_SECRET_ACCESS_KEY OPENAI_API_KEY; do
            if [ -z "${!name}" ] || [[ "${!name}" =~ $unsafe ]]; then
              echo "::error::$name in GitHub Environment production is missing or holds a space or one of \$\`\"'\\;&|<>()#~ (deploy/README.md)"
              exit 1
            fi
          done
          # Three users, three keys (spec 0012 P11): the app's key in a backup variable would let a
          # leaked .env delete the copies.
          if [ "$BACKUP_READ_ACCESS_KEY_ID" = "$BACKUP_WRITE_ACCESS_KEY_ID" ] \
            || [ "$BACKUP_READ_ACCESS_KEY_ID" = "$S3_ACCESS_KEY_ID" ] \
            || [ "$BACKUP_WRITE_ACCESS_KEY_ID" = "$S3_ACCESS_KEY_ID" ]; then
            echo "::error::S3_ACCESS_KEY_ID, BACKUP_READ_ACCESS_KEY_ID and BACKUP_WRITE_ACCESS_KEY_ID in GitHub Environment production must be keys of three different users (deploy/README.md, «Бэкапы»)"
            exit 1
          fi

      # By hand only: CI calls CD after every check of the push passed. Images of main are published
      # before the checks end, so GHCR holds tags that never went live; a tag is deployed by hand only
      # when CI's own CD once deployed its commit (check run "CD / Deploy to production" succeeded).
      - name: Check that the tag was live
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$IMAGE_TAG" --jq .sha)
          # The ref could resolve to a branch or tag of that name; a fork can make a commit with the
          # same prefix and a check run of that name on it. Only a commit of main with this prefix.
          [[ "${sha:0:7}" == "$IMAGE_TAG" ]] || { echo "$IMAGE_TAG resolves to $sha, not a commit with that hash" >&2; exit 1; }
          in_main=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .status)
          [[ "$in_main" == ahead || "$in_main" == identical ]] || { echo "$IMAGE_TAG is not a commit of main" >&2; exit 1; }
          live=$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" \
            -f check_name='CD / Deploy to production' -f filter=all \
            --jq '[.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success")] | length')
          [[ "$live" -gt 0 ]] || { echo "$IMAGE_TAG was never deployed by CI: roll back only to a version that was live" >&2; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The project's Node for scripts/measure-first-request.mjs (no packages). Only the measurement
      # needs it, so a failed setup skips that step and does not stop the deploy.
      - name: Set up Node
        id: node
        continue-on-error: true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: SSH to the server as the deploy user
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's key comes from a secret (checked by the owner), never from the network.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF
          ssh server 'echo "connected to $(hostname) as $(whoami)"'

      - name: Copy the deployment files
        # Synced in place: running containers bind-mount folders of deploy/ (nginx templates), and a
        # folder replaced as a whole stays mounted as the deleted old one. --delete removes files
        # that left the repository.
        run: rsync -a --delete deploy/ server:/opt/ai-fitting/deploy/

      - name: Write the server's .env
        # Rewritten on every deploy from GitHub: editing it on the server by hand is undone next time.
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          API_SENTRY_DSN: ${{ secrets.API_SENTRY_DSN }}
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
          PROXY_SECRET_NEXT: ${{ secrets.PROXY_SECRET_NEXT }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BACKUP_READ_ACCESS_KEY_ID: ${{ secrets.BACKUP_READ_ACCESS_KEY_ID }}
          BACKUP_READ_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_READ_SECRET_ACCESS_KEY }}
          BACKUP_WRITE_ACCESS_KEY_ID: ${{ secrets.BACKUP_WRITE_ACCESS_KEY_ID }}
          BACKUP_WRITE_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_WRITE_SECRET_ACCESS_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}/
        run: |
          {
            echo "POSTGRES_USER=$POSTGRES_USER"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "POSTGRES_DB=$POSTGRES_DB"
            echo "SITE_DOMAIN=$SITE_DOMAIN"
            echo "SENTRY_DSN=$SENTRY_DSN"
            echo "API_SENTRY_DSN=$API_SENTRY_DSN"
            echo "PROXY_SECRET=$PROXY_SECRET"
            echo "PROXY_SECRET_NEXT=$PROXY_SECRET_NEXT"
            echo "BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET"
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
            echo "MEDIA_BASE_URL=$MEDIA_BASE_URL"
            echo "S3_ENDPOINT=$S3_ENDPOINT"
            echo "S3_BUCKET=$S3_BUCKET"
            echo "S3_ACCESS_KEY_ID=$S3_ACCESS_KEY_ID"
            echo "S3_SECRET_ACCESS_KEY=$S3_SECRET_ACCESS_KEY"
            echo "BACKUP_BUCKET=$BACKUP_BUCKET"
            echo "BACKUP_AGE_RECIPIENT=$BACKUP_AGE_RECIPIENT"
            echo "BACKUP_READ_ACCESS_KEY_ID=$BACKUP_READ_ACCESS_KEY_ID"
            echo "BACKUP_READ_SECRET_ACCESS_KEY=$BACKUP_READ_SECRET_ACCESS_KEY"
            echo "BACKUP_WRITE_ACCESS_KEY_ID=$BACKUP_WRITE_ACCESS_KEY_ID"
            echo "BACKUP_WRITE_SECRET_ACCESS_KEY=$BACKUP_WRITE_SECRET_ACCESS_KEY"
            echo "OPENAI_API_KEY=$OPENAI_API_KEY"
            echo "SENTRY_ENVIRONMENT=production"
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "LOG_LEVEL=info"
          } | ssh server 'umask 077 && cat > /opt/ai-fitting/.env'

      - name: Log the server in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # $GITHUB_ACTOR expands here, on the runner, on purpose (SC2029).
        run: |
          # shellcheck disable=SC2029
          echo "$REGISTRY_TOKEN" | ssh server "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"

      - name: Deploy ${{ inputs.image_tag }}
        # $IMAGE_TAG expands on the runner on purpose (SC2029); the first step allows only a hash.
        run: |
          # shellcheck disable=SC2029
          ssh server "DEPLOY_PROFILE=server /opt/ai-fitting/deploy/scripts/deploy.sh '$IMAGE_TAG'"

      - name: Measure the first request
        # The first visitor after the switch, before the smoke test warms these pages (spec 0018
        # V25): the first request's time against the median of five more, read by the owner (AC14);
        # it exits 0 whatever it measures, and a crash of its own must not fail a deploy already
        # switched (a failed run would also refuse a later rollback to this version).
        if: steps.node.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: node scripts/measure-first-request.mjs "https://$SITE_DOMAIN" /catalog /catalog/dresses

      - name: Check from outside
        # From the internet, through DNS and the firewall, the site must report the new version.
        # -k (inside smoke-test.sh) until the real certificate is issued; TLS is checked separately.
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: scripts/smoke-test.sh "https://$SITE_DOMAIN" "$IMAGE_TAG"

      - name: Log the server out of GHCR
        if: always()
        run: ssh server 'docker logout ghcr.io' || true
