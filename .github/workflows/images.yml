name: Images

# Builds the api and web images, checks a blue-green deploy of them on the runner and, when asked,
# publishes them to GHCR. Called by CI twice: for pull requests without publishing, for pushes to
# main with publishing.
on:
  workflow_call:
    inputs:
      publish:
        description: Publish the images to GHCR (pushes to main only)
        type: boolean
        required: true
    outputs:
      image_tag:
        description: Image tag (7-character commit hash)
        value: ${{ jobs.images.outputs.image_tag }}

# No `permissions` here on purpose: the token is the caller's (contents: read for pull requests,
# plus packages: write for main). A called workflow cannot ask for more than its caller has, and a
# `permissions` block here would take packages: write away from main.

jobs:
  images:
    name: Build and check
    runs-on: ubuntu-latest
    # The Sentry token is a secret of the production environment (it accepts protected branches
    # only); a run that does not publish has no environment and so no token.
    environment: ${{ inputs.publish && 'production' || '' }}
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image tag and registry
        id: tag
        # The short commit hash is the image tag and the version the site reports; GHCR needs a
        # lower-case owner.
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/" >> "$GITHUB_ENV"
          echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build api and web images
        env:
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          # Browser-side Sentry and analytics are baked in at build time; empty values turn them off.
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
          # Only images that can be deployed send analytics: a pull request's image, run anywhere,
          # must not reach the production project (spec 0008 J24).
          NEXT_PUBLIC_MIXPANEL_TOKEN: ${{ inputs.publish && vars.NEXT_PUBLIC_MIXPANEL_TOKEN || '' }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_PROJECT_API: ${{ vars.SENTRY_PROJECT_API }}
          # Source maps are uploaded only for images that can be deployed (published from main).
          SENTRY_AUTH_TOKEN: ${{ inputs.publish && secrets.SENTRY_AUTH_TOKEN || '' }}
        run: scripts/ci-build-images.sh

      # The production setup on the runner with the same deploy.sh the server runs: a first deploy,
      # then a blue-green switch under a request loop that must see no failed request (AC26).
      - name: Deploy check
        run: scripts/ci-deploy-check.sh

      - name: Publish images to GHCR
        if: inputs.publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGE_REGISTRY}ai-fitting-api:${IMAGE_TAG}"
          docker push "${IMAGE_REGISTRY}ai-fitting-web:${IMAGE_TAG}"
          docker logout ghcr.io
